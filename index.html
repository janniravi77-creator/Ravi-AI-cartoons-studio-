<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ravi AI Cartoon Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101126;
      color: white;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 28px 15px;
      background: #191a3b;
      border-bottom: 2px solid #ffd166;
    }

    header h1 {
      color: #ffd166;
      font-size: 28px;
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #ddddf5;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    .card {
      background: #202143;
      padding: 22px;
      border-radius: 18px;
      border: 1px solid #44456b;
    }

    h2 {
      color: #ffd166;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    textarea,
    select,
    input {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #64658b;
      background: #11122c;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      background: #ffd166;
      color: #17172b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffe09a;
    }

    .secondary {
      background: #7778dd;
      color: white;
    }

    #result {
      margin-top: 22px;
      padding: 15px;
      border-radius: 12px;
      background: #11122c;
      border: 1px solid #64658b;
      overflow-wrap: anywhere;
    }

    #output {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note {
      color: #c7c8e7;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px 12px;
      color: #b8b9d8;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Ravi AI Cartoon Studio</h1>
    <p>Bring Your Cartoon Ideas to Life!</p>
  </header>

  <main class="container">
    <section class="card">

      <h2>✨ Cartoon Prompt Generator</h2>

      <p>
        Create fun cartoon ideas and animation prompts
        for your next video!
      </p>

      <label for="idea">Enter Your Cartoon Idea</label>

      <textarea
        id="idea"
        placeholder="Example: A cute baby elephant playing with colorful butterflies..."
      ></textarea>

      <label for="style">Choose Cartoon Style</label>

      <select id="style">
        <option value="Cute 3D animated cartoon">
          Cute 3D Cartoon
        </option>
        <option value="Pixar-inspired 3D animation">
          Pixar-Inspired 3D
        </option>
        <option value="Colorful nursery rhyme animation">
          Nursery Rhyme
        </option>
        <option value="Cute anime cartoon">
          Anime Cartoon
        </option>
        <option value="2D cartoon animation">
          2D Cartoon
        </option>
      </select>

      <label for="mood">Choose Mood</label>

      <select id="mood">
        <option value="happy and cheerful">
          Happy
        </option>
        <option value="funny and playful">
          Funny
        </option>
        <option value="magical and adventurous">
          Magical
        </option>
        <option value="sweet and heartwarming">
          Heartwarming
        </option>
